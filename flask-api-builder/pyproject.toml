[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-api-builder"
version = "2.0.0"
description = "Convention-based CRUD API builder for Flask, SQLAlchemy, and Marshmallow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BuyAutoParts" }]
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-marshmallow",
    "marshmallow",
    "sqlalchemy",
    "werkzeug",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flask_api_builder*"]
