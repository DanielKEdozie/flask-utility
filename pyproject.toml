[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-utility"
version = "1.3.0"
description = "Reusable Flask utilities: convention-based CRUD API builder, SQLAlchemy schema builder, and model event system (auto-slug)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BuyAutoParts" }]
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-marshmallow",
    "marshmallow-sqlalchemy",
    "python-slugify",
]

[project.optional-dependencies]
forms = ["wtforms-alchemy"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flask_utility*"]
